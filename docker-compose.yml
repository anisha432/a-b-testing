services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experimentiq
      POSTGRES_PASSWORD: experimentiq
      POSTGRES_DB: experimentiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimentiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://experimentiq:experimentiq@db:5432/experimentiq
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      APP_ENV: development
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
